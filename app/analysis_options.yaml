include: package:flutter_lints/flutter.yaml

# Zusätzliche bug-orientierte Regeln (Qualitäts-Setup 2026-07-18).
# Bewusst inline statt very_good_analysis: keine Paket-/SDK-Abhängigkeit,
# funktioniert identisch mit Flutter 3.24 (Workstation) und 3.44 (Mac).
linter:
  rules:
    - unawaited_futures          # vergessenes await bei Futures
    - cancel_subscriptions       # Stream-Subscriptions ohne cancel (Leaks)
    - close_sinks                # Sinks/Controller ohne close (Leaks)
    - throw_in_finally           # verschluckte Fehler
    - test_types_in_equals       # kaputte ==-Implementierungen
    - unnecessary_statements     # Ausdruck ohne Wirkung (oft vergessener Aufruf)
    - avoid_slow_async_io        # blockierende IO-Aufrufe in async-Code
    - avoid_type_to_string       # runtimeType-Vergleiche, brechen in Release
    - no_adjacent_strings_in_list # fehlendes Komma in String-Listen
    - only_throw_errors          # throw von Nicht-Exceptions
