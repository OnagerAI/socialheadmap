name: socialheadmap
description: Anonyme Abstimmungs-App mit interaktiver Deutschland-Karte
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  app_links: ^5.0.0
  google_sign_in: ^6.2.0
  flutter_facebook_auth: ^7.1.0
  sign_in_with_apple: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wappen/
