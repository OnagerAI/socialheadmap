<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialHeadmap Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Login-Overlay -->
<div id="loginOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">SocialHeadmap</h1>
    <p class="text-gray-500 text-sm mb-6">Admin-Bereich — bitte Admin-Key eingeben</p>
    <label class="block text-sm font-medium text-gray-700 mb-1">Admin-Key</label>
    <input
      id="loginKey"
      type="password"
      placeholder="shm-admin-key-dev"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4"
    />
    <button
      onclick="login()"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-4 py-2 text-sm transition"
    >
      Anmelden
    </button>
    <p id="loginError" class="text-red-500 text-xs mt-3 hidden">Falscher Admin-Key oder API nicht erreichbar.</p>
  </div>
</div>

<!-- Haupt-Layout -->
<div id="mainContent" class="hidden">

  <!-- Header -->
  <header class="bg-indigo-700 text-white px-6 py-4 flex items-center justify-between shadow">
    <div>
      <h1 class="text-xl font-bold">SocialHeadmap Admin</h1>
      <p class="text-indigo-200 text-xs mt-0.5" id="headerApiUrl"></p>
    </div>
    <button
      onclick="logout()"
      class="text-sm bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg transition"
    >
      Abmelden
    </button>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- Neue Frage erstellen -->
    <section class="bg-white rounded-2xl shadow p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-5">Neue Frage erstellen</h2>
      <form id="questionForm" onsubmit="createQuestion(event)" class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Titel <span class="text-red-500">*</span></label>
          <input
            id="qTitle"
            type="text"
            required
            placeholder="Frage in einem Satz …"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Beschreibung</label>
          <textarea
            id="qDescription"
            rows="3"
            placeholder="Optionaler Kontext zur Frage …"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-y"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kategorie <span class="text-red-500">*</span></label>
            <select
              id="qCategory"
              required
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
            >
              <option value="">— bitte wählen —</option>
              <option value="gesellschaft">Gesellschaft</option>
              <option value="politik">Politik</option>
              <option value="wirtschaft">Wirtschaft</option>
              <option value="umwelt">Umwelt</option>
              <option value="bildung">Bildung</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Antworttyp <span class="text-red-500">*</span></label>
            <select
              id="qAnswerType"
              required
              onchange="toggleOptions()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
            >
              <option value="">— bitte wählen —</option>
              <option value="binary">Ja / Nein (binary)</option>
              <option value="scale">Skala 1–5 (scale)</option>
              <option value="multiple_choice">Mehrfachauswahl (multiple_choice)</option>
            </select>
          </div>
        </div>

        <!-- Optionen – nur bei multiple_choice -->
        <div id="optionsBlock" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-2">Antwortoptionen (A – D)</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center flex-shrink-0">A</span>
              <input id="optA" type="text" placeholder="Option A" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center flex-shrink-0">B</span>
              <input id="optB" type="text" placeholder="Option B" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center flex-shrink-0">C</span>
              <input id="optC" type="text" placeholder="Option C" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold flex items-center justify-center flex-shrink-0">D</span>
              <input id="optD" type="text" placeholder="Option D" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
          </div>
          <p class="text-gray-400 text-xs mt-2">Leere Felder werden ignoriert.</p>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button
            type="submit"
            id="submitBtn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-5 py-2 text-sm transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <svg id="submitSpinner" class="hidden animate-spin w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            Speichern &amp; aktivieren
          </button>
          <button
            type="button"
            onclick="resetForm()"
            class="text-gray-500 hover:text-gray-700 text-sm underline"
          >
            Zurücksetzen
          </button>
        </div>

      </form>
    </section>

    <!-- Fragenliste -->
    <section class="bg-white rounded-2xl shadow p-6">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-semibold text-gray-800">Aktive Fragen</h2>
        <button
          onclick="loadQuestions()"
          class="text-sm text-indigo-600 hover:text-indigo-800 flex items-center gap-1"
          title="Neu laden"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582M20 20v-5h-.581M4.582 9A8 8 0 0120 15M19.418 15A8 8 0 014 9"/>
          </svg>
          Aktualisieren
        </button>
      </div>

      <div id="questionList">
        <div class="text-gray-400 text-sm text-center py-8">Lade Fragen …</div>
      </div>
    </section>

  </main>

  <footer class="text-center text-gray-400 text-xs py-6">
    SocialHeadmap Admin &mdash; nur für internen Gebrauch
  </footer>

</div>

<script>
  const API = 'https://shm.13-61-179-136.nip.io';
  let adminKey = '';

  // ─── Hilfsfunktionen ───────────────────────────────────────────────

  function adminHeaders() {
    return {
      'Content-Type': 'application/json',
      'X-Admin-Key': adminKey,
    };
  }

  function statusBadge(status) {
    const map = {
      active:   ['bg-green-100 text-green-700',  'Aktiv'],
      draft:    ['bg-yellow-100 text-yellow-700', 'Entwurf'],
      archive:  ['bg-gray-100 text-gray-500',     'Archiviert'],
      archived: ['bg-gray-100 text-gray-500',     'Archiviert'],
    };
    const [cls, label] = map[status] ?? ['bg-gray-100 text-gray-500', status];
    return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${cls}">${label}</span>`;
  }

  function typeBadge(type) {
    const map = {
      binary:          ['bg-blue-50 text-blue-600',   'Ja/Nein'],
      scale:           ['bg-purple-50 text-purple-600','Skala'],
      multiple_choice: ['bg-orange-50 text-orange-600','Mehrfachauswahl'],
    };
    const [cls, label] = map[type] ?? ['bg-gray-50 text-gray-500', type];
    return `<span class="text-xs font-medium px-2 py-0.5 rounded-full ${cls}">${label}</span>`;
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    const spinner = btn.querySelector('.btn-spinner');
    if (spinner) spinner.classList.toggle('hidden', !loading);
  }

  // ─── Auth ──────────────────────────────────────────────────────────

  async function login() {
    const key = document.getElementById('loginKey').value.trim();
    if (!key) return;
    const err = document.getElementById('loginError');
    err.classList.add('hidden');

    try {
      const res = await fetch(`${API}/questions/admin/verify`, {
        headers: { 'X-Admin-Key': key },
      });
      if (res.status === 403) throw new Error('Falscher Admin-Key');
      if (!res.ok) throw new Error(`API-Fehler HTTP ${res.status}`);
      adminKey = key;
      sessionStorage.setItem('shm_admin_key', key);
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('headerApiUrl').textContent = API;
      loadQuestions();
    } catch (e) {
      err.classList.remove('hidden');
    }
  }

  function logout() {
    sessionStorage.removeItem('shm_admin_key');
    adminKey = '';
    document.getElementById('loginKey').value = '';
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
  }

  // Auto-Login aus sessionStorage
  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('shm_admin_key');
    if (saved) {
      document.getElementById('loginKey').value = saved;
      login();
    }

    // Enter-Taste im Login-Feld
    document.getElementById('loginKey').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  });

  // ─── Fragen laden ─────────────────────────────────────────────────

  async function loadQuestions() {
    const container = document.getElementById('questionList');
    container.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">Lade Fragen …</div>';
    try {
      const res = await fetch(`${API}/questions/admin/all`, {
        headers: adminHeaders(),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const questions = await res.json();
      renderQuestions(questions);
    } catch (e) {
      container.innerHTML = `<div class="text-red-500 text-sm text-center py-8">Fehler beim Laden: ${e.message}</div>`;
    }
  }

  function renderQuestions(questions) {
    const container = document.getElementById('questionList');
    if (!questions.length) {
      container.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">Keine aktiven Fragen vorhanden.</div>';
      return;
    }

    const rows = questions.map(q => {
      const opts = q.options && q.options.length
        ? `<div class="mt-1 flex flex-wrap gap-1">
             ${q.options.map((o, i) => `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${String.fromCharCode(65+i)}: ${escHtml(o)}</span>`).join('')}
           </div>`
        : '';
      const desc = q.description
        ? `<p class="text-gray-400 text-xs mt-0.5">${escHtml(q.description)}</p>`
        : '';

      return `
        <div class="border border-gray-200 rounded-xl p-4 hover:border-indigo-200 transition" id="qcard-${q.id}">
          <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="font-medium text-gray-800 text-sm">${escHtml(q.title)}</span>
                ${statusBadge(q.status)}
                ${typeBadge(q.answer_type)}
              </div>
              ${desc}
              <p class="text-gray-400 text-xs mt-1">
                Kategorie: <span class="capitalize">${escHtml(q.category)}</span>
                &nbsp;&bull;&nbsp; ID: <code class="font-mono text-gray-400">${q.id.slice(0,8)}&hellip;</code>
              </p>
              ${opts}
            </div>
            <div class="flex gap-2 flex-shrink-0">
              <button
                onclick="activateQuestion('${q.id}', this)"
                class="text-xs bg-green-50 hover:bg-green-100 text-green-700 font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1"
                ${q.status === 'active' ? 'disabled title="Bereits aktiv"' : ''}
                style="${q.status === 'active' ? 'opacity:0.4;cursor:default' : ''}"
              >
                <span class="btn-spinner hidden animate-spin inline-block w-3 h-3 border-2 border-green-600 border-t-transparent rounded-full"></span>
                Aktivieren
              </button>
              <button
                onclick="archiveQuestion('${q.id}', this)"
                class="text-xs bg-gray-50 hover:bg-gray-100 text-gray-600 font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1"
                ${q.status === 'archive' || q.status === 'archived' ? 'disabled title="Bereits archiviert"' : ''}
                style="${q.status === 'archive' || q.status === 'archived' ? 'opacity:0.4;cursor:default' : ''}"
              >
                <span class="btn-spinner hidden animate-spin inline-block w-3 h-3 border-2 border-gray-400 border-t-transparent rounded-full"></span>
                Archivieren
              </button>
            </div>
          </div>
        </div>`;
    }).join('');

    container.innerHTML = `<div class="space-y-3">${rows}</div>`;
  }

  // ─── Aktionen ─────────────────────────────────────────────────────

  async function activateQuestion(id, btn) {
    setLoading(btn, true);
    try {
      const res = await fetch(`${API}/questions/${id}/activate`, {
        method: 'PATCH',
        headers: adminHeaders(),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }
      await loadQuestions();
    } catch (e) {
      alert(`Fehler beim Aktivieren: ${e.message}`);
      setLoading(btn, false);
    }
  }

  async function archiveQuestion(id, btn) {
    if (!confirm('Frage wirklich archivieren?')) return;
    setLoading(btn, true);
    try {
      const res = await fetch(`${API}/questions/${id}/archive`, {
        method: 'PATCH',
        headers: adminHeaders(),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }
      await loadQuestions();
    } catch (e) {
      alert(`Fehler beim Archivieren: ${e.message}`);
      setLoading(btn, false);
    }
  }

  // ─── Neue Frage ───────────────────────────────────────────────────

  function toggleOptions() {
    const type = document.getElementById('qAnswerType').value;
    const block = document.getElementById('optionsBlock');
    if (type === 'multiple_choice') {
      block.classList.remove('hidden');
      ['optA','optB','optC','optD'].forEach(id => {
        document.getElementById(id).required = false; // optional
      });
    } else {
      block.classList.add('hidden');
    }
  }

  function resetForm() {
    document.getElementById('questionForm').reset();
    document.getElementById('optionsBlock').classList.add('hidden');
  }

  async function createQuestion(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('submitSpinner');
    btn.disabled = true;
    spinner.classList.remove('hidden');

    const title       = document.getElementById('qTitle').value.trim();
    const description = document.getElementById('qDescription').value.trim() || null;
    const category    = document.getElementById('qCategory').value;
    const answer_type = document.getElementById('qAnswerType').value;

    let options = null;
    if (answer_type === 'multiple_choice') {
      const raw = ['optA','optB','optC','optD']
        .map(id => document.getElementById(id).value.trim())
        .filter(Boolean);
      if (raw.length < 2) {
        alert('Bitte mindestens 2 Antwortoptionen (A und B) angeben.');
        btn.disabled = false;
        spinner.classList.add('hidden');
        return;
      }
      options = raw;
    }

    const payload = { title, description, category, answer_type, options };

    try {
      // 1. Frage erstellen (Status: draft)
      const createRes = await fetch(`${API}/questions/`, {
        method: 'POST',
        headers: adminHeaders(),
        body: JSON.stringify(payload),
      });
      if (!createRes.ok) {
        const body = await createRes.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${createRes.status}`);
      }
      const created = await createRes.json();

      // 2. Sofort aktivieren
      const activateRes = await fetch(`${API}/questions/${created.id}/activate`, {
        method: 'PATCH',
        headers: adminHeaders(),
      });
      if (!activateRes.ok) {
        const body = await activateRes.json().catch(() => ({}));
        throw new Error(`Erstellt, aber Aktivierung fehlgeschlagen: ${body.detail || activateRes.status}`);
      }

      resetForm();
      await loadQuestions();

      // Kurze Erfolgs-Meldung
      showToast('Frage erfolgreich erstellt und aktiviert.');
    } catch (err) {
      alert(`Fehler: ${err.message}`);
    } finally {
      btn.disabled = false;
      spinner.classList.add('hidden');
    }
  }

  // ─── Toast ────────────────────────────────────────────────────────

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg z-50 transition-opacity duration-500';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 3000);
  }

  // ─── Sicherheit: HTML escapen ─────────────────────────────────────

  function escHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
